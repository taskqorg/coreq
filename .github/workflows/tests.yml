name: tests
on:
  # main pushes feed tag.yml; branch work runs through pull_request and merge_group.
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
env:
  CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
  CHECK_FULL: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/check.py --plan >> "$GITHUB_OUTPUT"
      - run: git diff --check
      - run: python3 scripts/check.test.py
      - run: python3 scripts/check.py --lint
  rust:
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only main pushes save the cache; the self-hosted runner keeps its own target directory.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/check.py
  tests:
    needs: [plan, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          RUST: ${{ needs.rust.result }}
        run: |
          test "$PLAN" = success
          case "$SCOPE" in
            docs) test "$RUST" = skipped ;;
            full) test "$RUST" = success ;;
            *) exit 1 ;;
          esac
