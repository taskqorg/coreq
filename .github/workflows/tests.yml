name: tests
on:
  push:
    branches: [main, 'taskq-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
  CHECK_FULL: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/check.py --plan >> "$GITHUB_OUTPUT"
      - run: git diff --check
      - run: python3 scripts/check.test.py
  rust:
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check.py
  tests:
    needs: [plan, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          RUST: ${{ needs.rust.result }}
        run: |
          test "$PLAN" = success
          case "$SCOPE" in
            docs) test "$RUST" = skipped ;;
            full) test "$RUST" = success ;;
            *) exit 1 ;;
          esac
