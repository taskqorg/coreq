# coreq.md Rules, Checks: main, review candidates and PRs run tests on every OS.
name: tests
on:
  push:
    branches: [main, 'taskq-*']
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup default stable
      - run: cargo test --locked
      - name: Diagnose Windows storage in isolation and under suite load
        if: always() && runner.os == 'Windows'
        env:
          COREQ_TELEMETRY_STORE_TRACE: '1'
        run: |
          rustc -Vv
          cargo test --locked --lib telemetry::broker::tests::child_process_flushes_full_selftest_sized_trace_through_resident_writer -- --exact --nocapture
          $ipc = $LASTEXITCODE
          cargo test --locked --lib telemetry::tests::concurrent_connections_do_not_lose_observations -- --exact --nocapture
          $open = $LASTEXITCODE
          cargo test --locked --lib -- --nocapture
          $parallel = $LASTEXITCODE
          Write-Host "Storage diagnostic exit codes: ipc=$ipc open=$open parallel=$parallel"
          exit ($ipc -bor $open -bor $parallel)
  tests: # required status check name; gates on the rust matrix
    needs: rust
    if: always() # a skipped job counts as passed; fail unless the matrix succeeded
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.rust.result }}" = success
