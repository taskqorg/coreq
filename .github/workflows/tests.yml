name: tests
on:
  # main pushes feed tag.yml; branch work runs through pull_request and merge_group.
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
env:
  CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
  CHECK_FULL: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/check.py --plan >> "$GITHUB_OUTPUT"
      - run: git diff --check
      - run: python3 scripts/check.test.py
      - run: python3 scripts/check.py --lint
  rust:
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # macOS runs on the self-hosted Apple-silicon runner; fork pull requests stay GitHub-hosted.
    runs-on: ${{ matrix.os == 'macos-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "taskq-mac"]') || matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only main pushes save the cache; the self-hosted runner keeps its own target directory.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/check.py
  # A consumer this candidate breaks blocks the merge (specq release contract). The list lives in coreq.md.
  consumers:
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    strategy:
      fail-fast: false
      matrix:
        consumer: [dashq, serverq]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: coreq
      - uses: actions/checkout@v4
        with:
          repository: taskqorg/${{ matrix.consumer }}
          path: consumer
      - working-directory: consumer
        run: cargo test --config "patch.\"https://github.com/taskqorg/coreq\".coreq.path=\"$GITHUB_WORKSPACE/coreq\""
  tests:
    needs: [plan, rust, consumers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          RUST: ${{ needs.rust.result }}
          CONSUMERS: ${{ needs.consumers.result }}
        run: |
          test "$PLAN" = success
          case "$SCOPE" in
            docs) test "$RUST" = skipped && test "$CONSUMERS" = skipped ;;
            full) test "$RUST" = success && test "$CONSUMERS" = success ;;
            *) exit 1 ;;
          esac
